x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *bounded-logging
    image: pgvector/pgvector:0.8.6-pg18-bookworm

    environment:
      POSTGRES_DB: ${AGENTHIRE_POSTGRES_DB}
      POSTGRES_USER: ${AGENTHIRE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AGENTHIRE_POSTGRES_PASSWORD}

    volumes:
      - agenthire_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AGENTHIRE_POSTGRES_USER} -d ${AGENTHIRE_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

  migrate:
    logging: *bounded-logging
    build:
      context: .
      target: runtime

    env_file:
      - .env

    environment:
      AGENTHIRE_POSTGRES_HOST: postgres
      AGENTHIRE_POSTGRES_PORT: "5432"

    command:
      - alembic
      - upgrade
      - head

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  api:
    logging: *bounded-logging
    build:
      context: .
      target: runtime

    env_file:
      - .env

    environment:
      AGENTHIRE_POSTGRES_HOST: postgres
      AGENTHIRE_POSTGRES_PORT: "5432"
      AGENTHIRE_DOCUMENT_STORAGE_PATH: /app/storage/candidate_documents
      AGENTHIRE_SEMANTIC_ENABLED: "${AGENTHIRE_SEMANTIC_ENABLED:-false}"
      AGENTHIRE_EMBEDDING_BASE_URL: http://ollama:11434
      AGENTHIRE_EXPLANATIONS_ENABLED: "${AGENTHIRE_EXPLANATIONS_ENABLED:-false}"
      AGENTHIRE_CHAT_BASE_URL: http://ollama:11434

    volumes:
      - agenthire_document_data:/app/storage

    ports:
      - "${AGENTHIRE_API_PORT:-8000}:8000"

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

    restart: unless-stopped

  extraction-worker:
    logging: *bounded-logging
    build:
      context: .
      target: extraction-worker
    env_file:
      - .env
    environment:
      AGENTHIRE_POSTGRES_HOST: postgres
      AGENTHIRE_POSTGRES_PORT: "5432"
      AGENTHIRE_DOCUMENT_STORAGE_PATH: /app/storage/candidate_documents
    volumes:
      - agenthire_document_data:/app/storage:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.document_extraction", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ollama:
    logging: *bounded-logging
    profiles: [semantic]
    image: ollama/ollama:0.40.3
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
    volumes:
      - agenthire_embedding_model_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 3g
    cpus: 2.0
    restart: unless-stopped

  embedding-worker:
    logging: *bounded-logging
    profiles: [semantic]
    build:
      context: .
      target: embedding-worker
    env_file: [.env]
    environment:
      AGENTHIRE_POSTGRES_HOST: postgres
      AGENTHIRE_POSTGRES_PORT: "5432"
      AGENTHIRE_SEMANTIC_ENABLED: "true"
      AGENTHIRE_EMBEDDING_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 32
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.document_embeddings", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  smoke:
    profiles:
      - smoke

    build:
      context: .
      target: smoke

    env_file:
      - .env

    environment:
      AGENTHIRE_API_BASE_URL: http://api:8000
      AGENTHIRE_POSTGRES_HOST: postgres
      AGENTHIRE_POSTGRES_PORT: "5432"
      AGENTHIRE_DOCUMENT_STORAGE_PATH: /app/storage/candidate_documents
      AGENTHIRE_SEMANTIC_ENABLED: "${AGENTHIRE_SEMANTIC_ENABLED:-false}"
      AGENTHIRE_EMBEDDING_BASE_URL: http://ollama:11434
      AGENTHIRE_EXPLANATIONS_ENABLED: "${AGENTHIRE_EXPLANATIONS_ENABLED:-false}"
      AGENTHIRE_CHAT_BASE_URL: http://ollama:11434

    volumes:
      - agenthire_document_data:/app/storage

    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

    restart: "no"

  test:
    profiles:
      - test

    build:
      context: .
      target: test


volumes:
  agenthire_postgres_data:
  agenthire_document_data:
  agenthire_embedding_model_data:
