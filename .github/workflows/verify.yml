name: Verify

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --no-install-project
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync pytest -rs
      - run: uv run --locked --no-sync python -m scripts.retrieval_evaluation --example

  real-stack:
    name: Docker / PostgreSQL / quality
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --no-install-project
      - run: uv run --locked --no-sync python -m scripts.ci_verify
