name: Verify

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --no-install-project
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync pytest -rs -W error
      - run: uv run --locked --no-sync python -m scripts.retrieval_evaluation --example
      - run: uv run --locked --no-sync python -m scripts.agent_evaluation --mode replay --output reports/agent-evaluation.json

  client:
    name: Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --test tests/recruiter_ui.test.mjs tests/recruiter_notifications.test.mjs tests/recruiter_api_errors.test.mjs tests/recruiter_workflow.test.mjs tests/recruiter_design.test.mjs tests/agents_ui.test.mjs
      - name: Verify synthetic workspace in Chrome
        if: runner.os == 'Linux'
        env:
          AGENTHIRE_BROWSER_BINARY: /usr/bin/google-chrome
        run: node scripts/design_browser.mjs --report reports/browser.json
      - name: Retain browser evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/browser.json
          retention-days: 14
          if-no-files-found: error

  real-stack:
    name: Docker / PostgreSQL / quality
    needs: [unit, client]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --no-install-project
      - name: Start the isolated local agent stack
        run: uv run --locked --no-sync python -m scripts.local_demo --start --seed
      - name: Exercise actual API, workers and verification SMTP
        run: uv run --locked --no-sync python -m scripts.agents_smoke
      - name: Compare migration with ORM
        run: docker compose -f compose.yaml -f compose.agents.yaml exec -T api alembic check
      - name: Stop the owned CI stack
        if: always()
        run: docker compose -f compose.yaml -f compose.agents.yaml down --remove-orphans
