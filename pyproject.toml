[project]
name = "agenthire-os"
version = "0.1.0"
description = "Enterprise AI Recruiting and Talent Intelligence Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
